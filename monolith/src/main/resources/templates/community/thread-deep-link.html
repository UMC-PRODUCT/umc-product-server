<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMC PRODUCT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6f8;
            color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            max-width: 360px;
            width: calc(100% - 48px);
            text-align: center;
        }
        p {
            font-size: 15px;
            margin: 0 0 16px;
        }
        .hint {
            font-size: 13px;
            color: #6b6b6b;
        }
        .hint a {
            color: #4b4bff;
        }
        .btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            background: #4b4bff;
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- 모바일: 앱 실행을 자동으로 시도하고, 앱이 열리지 않으면 스토어로 이동한다. -->
    <div class="card" th:if="${autoLaunch}">
        <p>UMC PRODUCT 앱으로 이동하고 있어요.</p>
        <p class="hint">앱이 열리지 않나요? <a th:href="${storeUrl}">앱 다운로드</a></p>
    </div>

    <!-- 데스크톱 등 앱을 열 수 없는 환경: 스토어 링크만 보여준다. -->
    <div class="card" th:unless="${autoLaunch}">
        <p>UMC PRODUCT 앱에서 확인할 수 있어요.</p>
        <a class="btn" th:href="${iosStoreUrl}">App Store에서 다운로드</a>
        <a class="btn" th:href="${androidStoreUrl}">Play 스토어에서 다운로드</a>
    </div>

    <script th:if="${autoLaunch}" th:inline="javascript">
        (function () {
            var appUrl = /*[[${appDeepLink}]]*/ '';
            var storeUrl = /*[[${storeUrl}]]*/ '';

            // 앱이 열리면 브라우저가 백그라운드로 가서(hidden/pagehide) 스토어 이동을 취소한다.
            var timer = setTimeout(function () {
                if (!document.hidden) {
                    window.location.replace(storeUrl);
                }
            }, 1500);

            function cancel() {
                clearTimeout(timer);
            }

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    cancel();
                }
            });
            window.addEventListener('pagehide', cancel);

            window.location.href = appUrl;
        })();
    </script>
</body>
</html>
